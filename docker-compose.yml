version: '3.8'

services:
  php-fpm:
    image: php:8.2-fpm-alpine
    volumes:
      - .:/var/www/html
    expose:
      - "9000:9000"

  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html
      - ./config/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - php-fpm
